<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KDM ANGKRINGAN - Smart POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Pustaka Chart.js untuk grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --primary: #d97706; 
            --primary-dark: #b45309;
            --primary-light: #fef3c7;
            --bg-body: #f1f5f9;
            --card-bg: #ffffff;
            --card-border: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #e2e8f0;
            --success: #15803d;
            --danger: #b91c1c;
            --radius-md: 14px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-body); display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--text-main); }
        .mobile-container { width: 100%; max-width: 480px; height: 100vh; background: #f8fafc; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        
        @media (min-height: 700px) and (min-width: 500px) {
            .mobile-container { height: 94vh; border-radius: 24px; border: 2px solid var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        }

        .app-header { background: #78350f; color: #ffffff; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 50; }
        .brand-info { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 2px solid #fef3c7; }
        .brand-info h1 { font-size: 18px; font-weight: 800; color: #fff; }
        .autosave-badge { background: #fff; color: #78350f; font-size: 11px; padding: 6px 12px; border-radius: 20px; font-weight: 800; border: 1px solid #fde68a; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #16a34a; }

        .app-content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 110px; }
        .tab-view { display: none; }
        .tab-view.active { display: block; }
        .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: #ffffff; border-top: 2px solid #cbd5e1; display: flex; justify-content: space-around; padding: 10px 4px 14px 4px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: #64748b; font-size: 11px; font-weight: 800; cursor: pointer; padding: 6px; flex: 1; border-radius: 10px; }
        .nav-item.active { color: #78350f; background: #fef3c7; }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .section-title { font-size: 18px; font-weight: 800; color: #0f172a; }
        .card { background: var(--card-bg); border-radius: var(--radius-md); padding: 16px; border: 1px solid var(--card-border); margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .btn { padding: 12px 18px; border-radius: var(--radius-sm); border: none; font-weight: 800; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: #78350f; color: #ffffff; }
        .btn-secondary { background: #e2e8f0; color: #0f172a; }
        
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 12px; font-weight: 800; margin-bottom: 6px; color: #1e293b; text-transform: uppercase; }
        .form-control { width: 100%; padding: 12px 14px; border: 2px solid #cbd5e1; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; outline: none; background: #ffffff; }

        .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px; }
        .stat-card { background: #f8fafc; border: 1px solid var(--card-border); padding: 12px; border-radius: var(--radius-sm); }
        .stat-label { font-size: 11px; color: #475569; font-weight: 800; text-transform: uppercase; }
        .stat-value { font-size: 15px; font-weight: 800; color: #0f172a; margin-top: 4px; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.6); display: none; justify-content: flex-end; flex-direction: column; z-index: 200; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #ffffff; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 20px; max-height: 85vh; overflow-y: auto; }
        
        .text-green { color: var(--success); }
        .text-red { color: var(--danger); }
        .chart-container { height: 200px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="mobile-container">
    <header class="app-header">
        <div class="brand-info">
            <img src="https://lh3.googleusercontent.com/d/18OkEwhN9AMLrGvfdetN3Bk3ztBIG72bs" class="brand-logo" alt="Logo">
            <h1>KDM POS</h1>
        </div>
        <div class="autosave-badge" id="syncStatus"><div class="pulse-dot"></div> Ready</div>
    </header>

    <main class="app-content">
        <!-- TAB REKAPAN -->
        <section id="tab-rekapan" class="tab-view active">
            <div class="section-header"><span class="section-title"><i class="fa-solid fa-chart-pie"></i> Rekapan</span></div>

            <div class="card">
                <label class="form-label">Pilih Tanggal Rekapan</label>
                <input type="date" id="recapDateFilter" class="form-control" onchange="renderRekapan()" style="margin-bottom:10px;">
                
                <label class="form-label" style="color:#78350f;">Saldo Awal (Manual)</label>
                <input type="number" id="inputSaldoAwal" class="form-control" placeholder="0" onchange="updateSaldoAwal()">
            </div>

            <div class="card">
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-label">Saldo Awal</div>
                        <div class="stat-value" id="displaySaldoAwal">Rp 0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Tunai</div>
                        <div class="stat-value" id="dailyCash">Rp 0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Pengeluaran</div>
                        <div class="stat-value text-red" id="dailyTotalExpense">Rp 0</div>
                    </div>
                    <div class="stat-card" style="border: 1px solid var(--primary);">
                        <div class="stat-label" style="color:var(--primary);">Tunai Aktual</div>
                        <div class="stat-value text-green" id="dailyActualCash">Rp 0</div>
                    </div>
                </div>
            </div>

            <!-- Performa Bulan Ini & Grafik -->
            <div class="card">
                <div class="section-title" style="margin-bottom: 10px; font-size: 14px;">Performa Bulan Ini</div>
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Omset</div>
                        <div class="stat-value text-green" id="monthlySale">Rp 0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Pengeluaran</div>
                        <div class="stat-value text-red" id="monthlyBuy">Rp 0</div>
                    </div>
                </div>
                
                <!-- Grafik Omset vs Pengeluaran -->
                <div class="chart-container">
                    <canvas id="chartBulanan"></canvas>
                </div>
            </div>

            <!-- Grafik Rekapan Pemilik -->
            <div class="card">
                <div class="section-title" style="margin-bottom: 10px; font-size: 14px;">Rekapan Penjualan Pemilik (Bulan Ini)</div>
                <div class="chart-container">
                    <canvas id="chartPemilik"></canvas>
                </div>
                <div id="ownerMonthlyList" style="margin-top:15px; font-size:12px;"></div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <button type="button" class="nav-item active" onclick="switchTab('rekapan', this)"><i class="fa-solid fa-chart-pie"></i> Rekapan</button>
        <!-- Tambahkan navigasi lain di sini -->
    </nav>
</div>

<script>
    // Inisialisasi Data
    let db = { 
        products: [], 
        transactions: [], 
        dailyStartingBalances: {} 
    };

    let chartBulanan = null;
    let chartPemilik = null;

    function formatRp(v) { return 'Rp ' + Number(v || 0).toLocaleString('id-ID'); }

    function updateSaldoAwal() {
        const date = document.getElementById('recapDateFilter').value;
        const val = document.getElementById('inputSaldoAwal').value;
        db.dailyStartingBalances[date] = val;
        saveLocal();
        renderRekapan();
    }

    function saveLocal() {
        localStorage.setItem('kdm_db', JSON.stringify(db));
    }

    function loadLocal() {
        const stored = localStorage.getItem('kdm_db');
        if(stored) db = JSON.parse(stored);
        if(!db.dailyStartingBalances) db.dailyStartingBalances = {};
    }

    function renderRekapan() {
        const selectedDate = document.getElementById('recapDateFilter').value || new Date().toISOString().split('T')[0];
        const currentMonth = selectedDate.slice(0, 7);
        
        // 1. Ambil Saldo Awal
        const saldoAwal = Number(db.dailyStartingBalances[selectedDate] || 0);
        document.getElementById('inputSaldoAwal').value = saldoAwal;
        document.getElementById('displaySaldoAwal').innerText = formatRp(saldoAwal);

        // 2. Kalkulasi Harian
        let dCash = 0, dExpense = 0;
        db.transactions.forEach(t => {
            if(t.date === selectedDate) {
                if(t.type === 'sale') dCash += Number(t.amount || 0);
                if(t.type === 'buy') dExpense += Number(t.amount || 0);
            }
        });
        
        document.getElementById('dailyCash').innerText = formatRp(dCash);
        document.getElementById('dailyTotalExpense').innerText = formatRp(dExpense);
        document.getElementById('dailyActualCash').innerText = formatRp(saldoAwal + dCash - dExpense);

        // 3. Kalkulasi Bulanan & Pemilik
        let mSale = 0, mBuy = 0;
        let ownerSales = {};

        db.transactions.forEach(t => {
            if(t.date && t.date.startsWith(currentMonth)) {
                if(t.type === 'sale') {
                    mSale += Number(t.amount || 0);
                    // Rinci per pemilik
                    if(t.items) {
                        t.items.forEach(item => {
                            let owner = item.owner || 'Milik Sendiri';
                            if(!ownerSales[owner]) ownerSales[owner] = 0;
                            ownerSales[owner] += (item.price * item.qty);
                        });
                    }
                }
                if(t.type === 'buy') mBuy += Number(t.amount || 0);
            }
        });

        document.getElementById('monthlySale').innerText = formatRp(mSale);
        document.getElementById('monthlyBuy').innerText = formatRp(mBuy);

        updateCharts(mSale, mBuy, ownerSales);
    }

    function updateCharts(omset, pengeluaran, ownerData) {
        const ctx1 = document.getElementById('chartBulanan').getContext('2d');
        const ctx2 = document.getElementById('chartPemilik').getContext('2d');

        if(chartBulanan) chartBulanan.destroy();
        if(chartPemilik) chartPemilik.destroy();

        chartBulanan = new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: ['Omset', 'Pengeluaran'],
                datasets: [{
                    data: [omset, pengeluaran],
                    backgroundColor: ['#15803d', '#b91c1c']
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        chartPemilik = new Chart(ctx2, {
            type: 'pie',
            data: {
                labels: Object.keys(ownerData),
                datasets: [{
                    data: Object.values(ownerData),
                    backgroundColor: ['#d97706', '#0369a1', '#7c3aed', '#db2777']
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function switchTab(id, el) {
        document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + id).classList.add('active');
    }

    // Inisialisasi
    document.getElementById('recapDateFilter').value = new Date().toISOString().split('T')[0];
    loadLocal();
    renderRekapan();

</script>
</body>
</html>
